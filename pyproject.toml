[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecadin-energy"
version = "0.1.0"
description = "ECADIN regional electricity forecasting and dashboard pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ecadin = "ecadin_energy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
